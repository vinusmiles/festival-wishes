<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festival Wishes Generator</title>
<meta name="theme-color" content="#d81b60">
<meta name="description" content="Thoughtful festival and birthday wishes in Telugu, English and Hindi, with verses, ready to share on WhatsApp and Instagram.">
<script data-goatcounter="https://vinusmiles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500&display=swap">
<style>
:root{--bg:#fafafa;--fg:#1c1b1f;--surface:#fff;--line:#ddd;--accent:#d81b60;--accent-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f1f1f1;--surface:#1e1e1e;--line:#333;--accent:#f06292;--accent-fg:#1c1b1f}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f1f1f1;--surface:#1e1e1e;--line:#333;--accent:#f06292;--accent-fg:#1c1b1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 10px}
label{display:block;font-size:.8rem;margin:10px 0 4px;opacity:.8}
select,input{width:100%;min-width:0;padding:11px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{font-size:1rem;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
button.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
#gen{width:100%;margin-top:14px}
h2{font-size:.9rem;margin:18px 0 6px;opacity:.8;font-weight:600}
.card{position:relative;margin-top:10px;border-radius:18px;padding:34px 20px 20px;color:#fff;font-weight:600;line-height:1.5;cursor:pointer;border:3px solid transparent;opacity:.55;transform:scale(.96);transition:transform .2s,opacity .2s,box-shadow .2s}
.card.sel{opacity:1;transform:none;border-color:#fff;box-shadow:0 0 0 4px var(--accent),0 12px 28px rgba(0,0,0,.35)}
.card small{position:absolute;top:10px;left:16px;font-size:.75rem;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:99px}
.card.sel small{background:#fff;color:#1c1b1f;font-weight:700;font-size:.8rem;padding:4px 12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.txt{white-space:pre-wrap;text-align:center;font-size:1.02rem}
[hidden]{display:none!important}#imgbox{margin-top:12px;text-align:center}#imgbox img{max-width:100%;border-radius:14px;border:1px solid var(--line)}#imgbox p{font-size:.85rem;margin:8px 0}.btn{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}
.card{font-family:Inter,"Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif}
.pre,.post,.mean{white-space:pre-wrap;text-align:center}.pre,.post{font-size:1.02rem}.post{margin-top:12px}
.shloka{margin:16px 0 8px;padding:16px 14px;border:1px solid #d4af37;border-radius:14px;background:rgba(255,236,170,.16);text-align:center;line-height:2;font-size:1.08rem;font-weight:500}
.shloka.te{font-family:"Noto Serif Telugu",serif}.shloka.hi{font-family:"Noto Serif Devanagari",serif}
.shloka.en{font-family:"Noto Serif",Georgia,serif;font-style:italic;line-height:1.9}
.shloka.ar{font-family:"Noto Naskh Arabic",serif;font-size:1.3rem;font-style:normal}
.shloka{white-space:pre-line}
.src{font-size:.72rem;font-weight:400;text-align:center;opacity:.8;margin:2px 4px 0}
.mean{font-size:.9rem;font-weight:400;line-height:1.5;margin:6px 4px 4px;opacity:.97}
.card .edbtn{position:absolute;top:6px;right:10px;font-size:.8rem;padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.6);font-weight:600}
.card.editing .edbtn{background:#fff;color:#1c1b1f;border-color:#fff}
.empty{text-align:center;opacity:.7;font-size:.9rem;padding:24px 8px;border:1px dashed var(--line);border-radius:14px;margin-top:10px}
.card [contenteditable]{outline:2px dashed rgba(255,255,255,.85);outline-offset:4px;border-radius:6px;cursor:text;min-height:1.5em}
.card [contenteditable]:empty::before{content:attr(data-ph);opacity:.7}
.card.editing{opacity:1;cursor:default}
#msg{min-height:1.4em;text-align:center;font-size:.9rem;margin-top:10px}
#msg.ok{color:#2e7d32;font-weight:600}
#waweb{text-align:center;font-size:.85rem;margin:4px 0 0}#waweb a{color:var(--accent);font-weight:600}
@media (prefers-color-scheme:dark){#msg.ok{color:#81c784}}
</style>
</head>
<body>
<main>
<h1>🎉 Festival Wishes Generator</h1>
<label for="fest">Festival</label><select id="fest"></select>
<div class="g3">
<div><label for="lang">Language</label><select id="lang"><option value="te">తెలుగు</option><option value="en">English</option><option value="hi">हिन्दी</option></select></div>
<div><label for="tone">Tone</label><select id="tone"><option>Warm</option><option>Formal</option></select></div>
<div><label for="len">Length</label><select id="len"><option value="short">Short</option><option value="medium" selected>Medium</option><option value="long">Long</option></select></div>
</div>
<div class="g2">
<div><label for="to">To (optional)</label><input id="to" maxlength="30" placeholder="Recipient" autocomplete="off"></div>
<div><label for="from">From (optional)</label><input id="from" maxlength="30" placeholder="Your name" autocomplete="off"></div>
</div>
<button id="gen">✨ Create 3 wishes</button>
<h2 id="pickh" hidden>Tap a wish to choose it</h2>
<div id="cards" role="radiogroup"><p class="empty">Choose your options, then tap ✨ Create 3 wishes.</p></div>
<div class="g2" style="margin-top:12px">
<button id="wa">WhatsApp</button>
<button id="ig">Instagram</button>
<button id="share" class="alt">Share…</button>
<button id="copy" class="alt">Copy</button>
<button id="save" class="alt" style="grid-column:1/-1">🖼️ Share as Image</button>
</div>
<div id="imgbox" hidden><img id="prev" alt="Wish image"><p id="imgtip"></p><a id="dl" class="btn" download="festival-wish.png">⬇ Download PNG</a></div>
<div id="msg" aria-live="polite"></div>
<p id="waweb" hidden>App didn’t open? <a id="wawebl" target="_blank" rel="noopener">Use WhatsApp Web instead</a></p>
</main>
<script src="wishes.js"></script>
<script>
// Header line per festival: [emoji, English, Telugu, Hindi]. Wish text and verses live in wishes.js.
const F={
"Dasara":["🏹","Happy Dasara","దసరా శుభాకాంక్షలు","दशहरा की हार्दिक शुभकामनाएँ"],
"Diwali":["🪔","Happy Diwali","దీపావళి శుభాకాంక్షలు","दिवाली की हार्दिक शुभकामनाएँ"],
"Ugadi":["🌿","Happy Ugadi","ఉగాది శుభాకాంక్షలు","उगादी की हार्दिक शुभकामनाएँ"],
"Sankranti":["🪁","Happy Sankranti","సంక్రాంతి శుభాకాంక్షలు","मकर संक्रांति की हार्दिक शुभकामनाएँ"],
"Vinayaka Chavithi":["🐘","Happy Vinayaka Chavithi","వినాయక చవితి శుభాకాంక్షలు","गणेश चतुर्थी की हार्दिक शुभकामनाएँ"],
"Bathukamma":["🌼","Happy Bathukamma","బతుకమ్మ శుభాకాంక్షలు","बतुकम्मा की हार्दिक शुभकामनाएँ"],
"Bonalu":["🥁","Happy Bonalu","బోనాల పండుగ శుభాకాంక్షలు","बोनालु की हार्दिक शुभकामनाएँ"],
"Sri Rama Navami":["🏹","Happy Sri Rama Navami","శ్రీరామ నవమి శుభాకాంక్షలు","राम नवमी की हार्दिक शुभकामनाएँ"],
"Maha Shivaratri":["🔱","Happy Maha Shivaratri","మహాశివరాత్రి శుభాకాంక్షలు","महाशिवरात्रि की हार्दिक शुभकामनाएँ"],
"Varalakshmi Vratham":["🪷","Happy Varalakshmi Vratham","వరలక్ష్మీ వ్రతం శుభాకాంక్షలు","वरलक्ष्मी व्रत की हार्दिक शुभकामनाएँ"],
"Eid":["🌙","Eid Mubarak","ఈద్ ముబారక్","ईद मुबारक"],
"Christmas":["🎄","Merry Christmas","క్రిస్మస్ శుభాకాంక్షలు","क्रिसमस की हार्दिक शुभकामनाएँ"],
"New Year":["🎉","Happy New Year","నూతన సంవత్సర శుభాకాంక్షలు","नए साल की हार्दिक शुभकामनाएँ"],
"Birthday":["🎂","Happy Birthday","పుట్టినరోజు శుభాకాంక్షలు","जन्मदिन की हार्दिक शुभकामनाएँ"]
};
const LI={en:1,te:2,hi:3};
// Name line: warm/funny vs formal. Gender-neutral in all three languages.
const D={en:"Dear",te:"ప్రియమైన",hi:"प्रिय"};
function nameLine(L,tone,to){
  if(!to)return "";
  if(tone!=="Formal")return D[L]+" "+to+",\n\n";
  if(L==="te")return (/గారు$/.test(to)?to.replace(/గారు$/,"గారికి"):to+" గారికి")+",\n\n";
  if(L==="hi")return "आदरणीय "+to+(/(जी|ji)$/i.test(to)?"":" जी")+",\n\n";
  return "Dear "+to+",\n\n";
}
// One clearly different colour per option: orange-pink, blue-purple, teal-green
const G=[["#ff6f00","#d81b60"],["#1e88e5","#6a1b9a"],["#00897b","#2e7d32"]];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// Picks 3 different ideas (of the 5 written for this festival/language/tone) and builds each at the chosen length.
// Short = s, Medium = s + m, Long = s + m + l. The previous set for the same combination is avoided on regenerate.
const PARTS={short:["s"],medium:["s","m"],long:["s","m","l"]};
const lastPick={};
function pickIdeas(key,n){
  let idx,tries=0;
  do{idx=shuffle([...Array(n).keys()]).slice(0,3);tries++}
  while(lastPick[key]&&idx.slice().sort().join()===lastPick[key]&&tries<10);
  lastPick[key]=idx.slice().sort().join();
  return idx;
}
function build(k,L,len,tone,picks,to,from){
  const pool=WISHES[k][L][tone];
  const sh=tone!=="Funny"&&SH[k]&&SH[k][L];
  return picks.map(i=>{
    const e=pool[i];
    return {
      pre:nameLine(L,tone,to)+F[k][0]+" "+F[k][LI[L]]+"!\n\n"+PARTS[len].map(p=>e[p]).join(" "),
      shloka:sh?sh.t:"",meaning:sh?sh.m:"",src:sh?SH[k].src:"",ar:!!(sh&&sh.ar),
      post:from?"— "+from:"",
      L,k,id:e.id};
  });
}
//UI
const $=id=>document.getElementById(id);
const FONT="system-ui,'Noto Sans Telugu','Noto Sans Devanagari',sans-serif";
const track=n=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:n,title:n,event:true})}catch(e){}};
let texts=[],grads=[],picks=[],sel=0,tm,editing=false;
if(!window.WISHES){document.querySelector("main").insertAdjacentHTML("afterbegin","<p style=\"color:#c62828;font-weight:600\">Wishes couldn’t load (wishes.js is missing). Upload wishes.js next to index.html.</p>")}
Object.keys(F).forEach(f=>$("fest").add(new Option(f,f)));
function setTones(){
  const t=$("tone"),was=t.value,list=["Warm","Funny","Formal"];
  t.textContent="";list.forEach(o=>t.add(new Option(o)));t.value=list.includes(was)?was:"Warm";
}
setTones();
const need=()=>{if(texts.length)return true;say("Tap ✨ Create 3 wishes first.");return false};
function say(t,ok){const m=$("msg");m.textContent=t;m.className=ok?"ok":"";clearTimeout(tm);if(t)tm=setTimeout(()=>{m.textContent=""},4500)}
function flash(b,label){if(!b.dataset.l)b.dataset.l=b.textContent;b.textContent=label;clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent=b.dataset.l},1600)}
const toText=w=>[w.pre.trim(),w.shloka?w.shloka+"\n("+w.meaning+")":"",(w.post||"").trim()].filter(Boolean).join("\n\n");
const cur=()=>toText(texts[sel]);
const clean=w=>({...w,pre:w.pre.trim(),post:(w.post||"").trim()});
function render(){
  const box=$("cards");box.textContent="";$("imgbox").hidden=true;
  $("pickh").hidden=!texts.length;
  texts.forEach((w,i)=>{
    const d=document.createElement("div"),h=document.createElement("small"),ed=editing&&i===sel;
    d.className="card"+(i===sel?" sel":"")+(ed?" editing":"");d.tabIndex=0;d.setAttribute("role","radio");d.setAttribute("aria-checked",i===sel?"true":"false");
    d.style.background="linear-gradient(135deg,"+grads[i][0]+","+grads[i][1]+")";
    h.textContent=(ed?"✏️ Editing · ":i===sel?"✓ Selected · ":"")+"Option "+(i+1)+(w.edited&&!ed?" · edited":"");d.append(h);
    if(i===sel){const eb=document.createElement("button");eb.type="button";eb.className="edbtn";eb.textContent=ed?"✔ Done":"✏️ Edit";eb.setAttribute("aria-label",ed?"Finish editing":"Edit this wish");
      eb.onclick=e=>{e.stopPropagation();toggleEdit()};d.append(eb)}
    const add=(cls,t,lang)=>{if(!t)return null;const e=document.createElement("div");e.className=cls;e.textContent=t;if(lang)e.lang=lang;d.append(e);return e};
    const editable=(cls,key,ph)=>{
      const e=document.createElement("div");e.className=cls;e.textContent=w[key];e.lang=w.L;e.dataset.ph=ph;
      try{e.contentEditable="plaintext-only"}catch(_){}
      if(e.contentEditable!=="plaintext-only")e.contentEditable="true";
      e.oninput=()=>{w[key]=e.innerText.replace(/\n+$/,"");w.edited=true};
      d.append(e);return e;
    };
    const pre=ed?editable("pre","pre","Type your wish"):add("pre",w.pre);
    if(w.shloka){const ar=w.ar,e=add("shloka "+(ar?"ar":w.L),w.shloka,ar?"ar":w.L);if(ar)e.dir="rtl";add("mean",w.meaning,w.L);add("src",w.src?"— "+w.src:"","en")}
    if(ed)editable("post","post","Add a closing line or your name (optional)");else add("post",w.post);
    const pick=()=>{if(ed)return;editing=false;sel=i;render()};
    d.onclick=pick;d.onkeydown=e=>{if(e.target===d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick()}};
    box.appendChild(d);
    if(ed)setTimeout(()=>{try{pre.focus()}catch(_){}},0);
  });
  if(!texts.length){const p=document.createElement("p");p.className="empty";p.textContent="Choose your options, then tap ✨ Create 3 wishes.";box.append(p)}
}
function rebuild(){texts=build($("fest").value,$("lang").value,$("len").value,$("tone").value,picks,$("to").value.trim(),$("from").value.trim());render()}
function gen(){
  const k=$("fest").value,L=$("lang").value,t=$("tone").value;editing=false;
  picks=pickIdeas(k+"|"+L+"|"+t,WISHES[k][L][t].length);grads=G;sel=0;rebuild();say("");$("gen").textContent=GEN}
async function copy(){
  const t=cur();let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){
    const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy")}catch(_){}ta.remove();
  }
  if(ok){flash($("copy"),"Copied ✔");say("Option "+(sel+1)+" copied ✔",1)}else say("Couldn’t copy. Press and hold the wish text to select it.");
  return ok;
}
async function shareNative(){
  if(!navigator.share){if(await copy())say("Sharing isn’t available here, so the wish was copied instead ✔",1);return}
  try{await navigator.share({text:cur()});flash($("share"),"Shared ✔")}
  catch(e){if(e.name!=="AbortError"&&await copy())say("Sharing didn’t open, so the wish was copied ✔",1)}
}
function wrap(x,t,w){
  const lines=[];
  t.split("\n").forEach(p=>{if(!p){lines.push("");return}let l="";
    p.split(" ").forEach(word=>{const u=l?l+" "+word:word;if(x.measureText(u).width>w&&l){lines.push(l);l=word}else l=u});
    lines.push(l)});
  return lines;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function loadFonts(w){
  try{
    const fam=w.ar?'"Noto Naskh Arabic"':w.L==="te"?'"Noto Serif Telugu"':w.L==="hi"?'"Noto Serif Devanagari"':'"Noto Serif"';
    const sans=w.L==="te"?'"Noto Sans Telugu"':w.L==="hi"?'"Noto Sans Devanagari"':"Inter";
    await Promise.race([Promise.all([document.fonts.load("500 40px "+fam,w.shloka||"a"),document.fonts.load("600 40px "+sans,w.pre),document.fonts.load("400 40px "+sans,w.meaning||"a")]),new Promise(r=>setTimeout(r,2000))]);
  }catch(e){}
}
async function makeImage(w,g){
  await loadFonts(w);
  const s=1080,c=document.createElement("canvas");c.width=c.height=s;
  const x=c.getContext("2d"),gr=x.createLinearGradient(0,0,s,s);
  gr.addColorStop(0,g[0]);gr.addColorStop(1,g[1]);x.fillStyle=gr;x.fillRect(0,0,s,s);
  const SANS="Inter,'Noto Sans Telugu','Noto Sans Devanagari',system-ui,sans-serif";
  const ar=w.ar;
  const SER=ar?"'Noto Naskh Arabic',serif":w.L==="te"?"'Noto Serif Telugu',serif":w.L==="hi"?"'Noto Serif Devanagari',serif":"'Noto Serif',Georgia,serif";
  const M=96,W=s-2*M,BP=30;
  const plan=sz=>{
    const secs=[];let h=0;
    const add=(kind,t,font,lh,wid)=>{x.font=font;const lines=wrap(x,t,wid);secs.push({kind,lines,font,lh});h+=lines.length*lh+(kind==="shloka"?2*BP:0)+sz*0.7};
    add("pre",w.pre,"600 "+sz+"px "+SANS,sz*1.45,W);
    if(w.shloka){add("shloka",w.shloka,(w.L==="en"&&!ar?"italic ":"")+"500 "+sz*1.05+"px "+SER,sz*1.9,W-2*BP);add("mean",w.meaning,"400 "+sz*0.8+"px "+SANS,sz*1.35,W)}
    if(w.post)add("post",w.post,"600 "+sz*0.9+"px "+SANS,sz*1.4,W);
    return {secs,h:h-sz*0.7};
  };
  let size=52,P;
  for(;size>=22;size-=2){P=plan(size);if(P.h<=s-2*M)break}
  let y=(s-P.h)/2;
  x.textAlign="center";x.textBaseline="middle";
  P.secs.forEach(sec=>{
    x.font=sec.font;
    const bh=sec.lines.length*sec.lh;
    if(sec.kind==="shloka"){rr(x,M,y,W,bh+2*BP,28);x.fillStyle="rgba(255,236,170,0.18)";x.fill();x.lineWidth=3;x.strokeStyle="#d4af37";x.stroke();y+=BP}
    x.fillStyle="#fff";
    sec.lines.forEach((l,i)=>x.fillText(l,s/2,y+i*sec.lh+sec.lh/2));
    y+=bh+(sec.kind==="shloka"?BP:0)+size*0.7;
  });
  return new Promise(res=>c.toBlob(b=>res(b),"image/png"));
}
const CAN_DL=true;
let imgUrl="";
const toDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function showImage(b){
  b=b||await makeImage(clean(texts[sel]),grads[sel]);
  if(imgUrl)URL.revokeObjectURL(imgUrl);
  imgUrl=URL.createObjectURL(b);
  $("prev").src=await toDataUrl(b);
  const a=$("dl");a.href=imgUrl;a.hidden=!CAN_DL;
  $("imgtip").textContent=CAN_DL?"Tap Download PNG, or press and hold the image to save it. Then post it from Instagram.":"Press and hold the image to save it, then post it from Instagram.";
  $("imgbox").hidden=false;
  try{$("imgbox").scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}
  return b;
}
// Opens the phone's share sheet with the PNG attached (pick WhatsApp there, like sharing a payment screenshot).
// Where file sharing isn't supported (most desktops), the image is shown below with a Download button.
$("save").onclick=async()=>{
  if(!need())return;track("share-image");
  let b;
  try{
    b=await makeImage(clean(texts[sel]),grads[sel]);
    const f=new File([b],"festival-wish.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});flash($("save"),"Shared ✔");return}
  }catch(e){if(e.name==="AbortError")return}
  try{await showImage(b);say("This browser can’t share images directly. Your image is ready below to download.",1)}
  catch(e){say("Couldn’t create the image on this device. Use Copy instead.")}
};
// WhatsApp: opens WhatsApp with the wish text filled in, ready to pick a chat.
// Phones use wa.me. On computers, wa.me goes through a WhatsApp redirect page that breaks emojis
// for the desktop app, so computers open the app directly (whatsapp://) and offer WhatsApp Web as a backup.
const IS_MOBILE=(navigator.userAgentData&&navigator.userAgentData.mobile)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
let waT;
$("wa").onclick=()=>{
  if(!need())return;track("share-whatsapp");
  const t=encodeURIComponent(cur());
  if(IS_MOBILE){say("Opening WhatsApp…",1);setTimeout(()=>{location.href="https://wa.me/?text="+t},300);return}
  say("Opening the WhatsApp app…",1);
  $("wawebl").href="https://web.whatsapp.com/send?text="+t;$("waweb").hidden=false;
  clearTimeout(waT);waT=setTimeout(()=>{$("waweb").hidden=true},15000);
  location.href="whatsapp://send?text="+t;
};
// Instagram: it has no link that fills in text, so copy the wish and open Instagram Direct to paste it
$("ig").onclick=async()=>{
  if(!need())return;track("share-instagram");
  const ok=await copy();
  say(ok?"Wish copied ✔ Opening Instagram… paste it in a chat (press and hold → Paste).":"Opening Instagram…",1);
  setTimeout(()=>{location.href="https://www.instagram.com/direct/inbox/"},900);
};
$("share").onclick=()=>{if(!need())return;track("share-menu");shareNative()};
$("copy").onclick=()=>{if(!need())return;track("copy");copy()};
$("gen").onclick=()=>{track("generate");gen()};
function toggleEdit(){editing=!editing;render();say(editing?"Edit the text on the card, then tap ✔ Done.":"Changes saved ✔",!editing)}
const GEN="✨ Create 3 wishes",REGEN="🔄 Regenerate wishes";
const changed=()=>{if(texts.length){$("gen").textContent=REGEN;say("Tap 🔄 Regenerate wishes to apply your changes.")}};
$("fest").onchange=()=>{setTones();changed()};
["lang","tone","len"].forEach(i=>$(i).onchange=changed);
["to","from"].forEach(i=>$(i).oninput=changed);
</script>
