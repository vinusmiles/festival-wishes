<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festival Wishes</title>
<meta name="theme-color" content="#d81b60">
<meta name="description" content="Create festival wishes with shlokas in Telugu, English and Hindi and share them on WhatsApp and Instagram.">
<style>
:root{--bg:#fafafa;--fg:#1c1b1f;--surface:#fff;--line:#ddd;--accent:#d81b60;--accent-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f1f1f1;--surface:#1e1e1e;--line:#333;--accent:#f06292;--accent-fg:#1c1b1f}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f1f1f1;--surface:#1e1e1e;--line:#333;--accent:#f06292;--accent-fg:#1c1b1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 14px}
label{display:block;font-size:.8rem;margin:10px 0 4px;opacity:.8}
select,input{width:100%;padding:12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{font-size:1rem;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
button.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
#gen{width:100%;margin-top:14px}
#card{margin-top:16px;border-radius:20px;min-height:230px;padding:28px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:1.1rem;font-weight:700;line-height:1.5;white-space:pre-wrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#msg{min-height:1.2em;text-align:center;font-size:.85rem;margin-top:10px;opacity:.8}
</style>
<script data-goatcounter="https://vinusmiles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
<h1>🎉 Festival Wishes</h1>
<label for="fest">Festival</label><select id="fest"></select>
<label for="lang">Language</label><select id="lang"><option value="te">తెలుగు (Telugu)</option><option value="en">English</option><option value="hi">हिन्दी (Hindi)</option></select>
<button id="gen">✨ Generate wish</button>
<div id="card">Tap Generate</div>
<div class="row">
<button id="wa">WhatsApp</button>
<button id="ig">Instagram</button>
<button id="share" class="alt">Share…</button>
<button id="copy" class="alt">Copy</button>
</div>
<div id="msg"></div>
</main>
<script>
// festival: [emoji, English, Telugu, Hindi] greetings

const LI={en:1,te:2,hi:3};
const S={

"सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते। भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तु ते॥"
],

"ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम्। उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात्॥"
],

],
"Birthday": [
"Pashyema Sharadah Shatam. Jivema Sharadah Shatam. Shrinuyama Sharadah Shatam.",
"పశ్యేమ శరదః శతం । జీవేమ శరదః శతం । శృణుయామ శరదః శతం ॥",
"पश्येम शरदः शतम्। जीवेम शरदः शतम्। शृणुयाम शरदः शतम्॥"
]
};
const G=[["#ff6f00","#d81b60"],["#1e88e5","#8e24aa"],["#00897b","#43a047"],["#e53935","#fb8c00"]];
const $=id=>document.getElementById(id);
let grad=G[0];
Object.keys(F).forEach(f=>$("fest").add(new Option(f)));
const track=n=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:n,title:n,event:true})}catch(e){}};
const say=t=>{$("msg").textContent=t};
const text=()=>$("card").textContent;

function gen(){
  const L=$("lang").value,k=$("fest").value,f=F[k],b=B[L];
  $("card").textContent=f[0]+" "+f[LI[L]]+"!\n\n"+b[Math.floor(Math.random()*b.length)]+"\n\n"+S[k][LI[L]-1];
  grad=G[Math.floor(Math.random()*G.length)];
  $("card").style.background="linear-gradient(135deg,"+grad[0]+","+grad[1]+")";
  say("");
}

function makeImage(){
  return new Promise(res=>{
    const s=1080,c=document.createElement("canvas");c.width=c.height=s;
    const x=c.getContext("2d"),g=x.createLinearGradient(0,0,s,s);
    g.addColorStop(0,grad[0]);g.addColorStop(1,grad[1]);x.fillStyle=g;x.fillRect(0,0,s,s);
    x.fillStyle="#fff";x.font="bold 50px system-ui,'Noto Sans Telugu','Noto Sans Devanagari',sans-serif";x.textAlign="center";x.textBaseline="middle";
    const lines=[];
    text().split("\n").forEach(p=>{if(!p){lines.push("");return}let l="";
      p.split(" ").forEach(w=>{const t=l?l+" "+w:w;if(x.measureText(t).width>s-200&&l){lines.push(l);l=w}else l=t});
      lines.push(l)});
    const lh=74,y0=s/2-(lines.length-1)*lh/2;
    lines.forEach((t,i)=>x.fillText(t,s/2,y0+i*lh));
    c.toBlob(b=>res(b),"image/png");
  });
}

async function shareNative(){
  try{await navigator.share({text:text()});}catch(e){if(e.name!=="AbortError")copy()}
}
async function copy(){
  try{await navigator.clipboard.writeText(text());say("Copied to clipboard ✔")}
  catch(e){const r=document.createRange();r.selectNodeContents($("card"));const s=getSelection();s.removeAllRanges();s.addRange(r);say("Text selected, press Copy on your phone")}
}

$("gen").onclick=gen;["fest","lang"].forEach(i=>$(i).onchange=gen);
$("copy").onclick=copy;
$("share").onclick=shareNative;
$("wa").onclick=()=>{track("share-whatsapp");const u="https://wa.me/?text="+encodeURIComponent(text());setTimeout(()=>{location.href=u},300)};
$("ig").onclick=async()=>{
  try{
    const b=await makeImage(),f=new File([b],"wish.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e.name==="AbortError")return}
  await copy();say("Image sharing isn’t supported here. Text copied, paste it in Instagram.");
};
[["gen","generate"],["ig","share-instagram"],["share","share-menu"],["copy","copy"]].forEach(([i,n])=>$(i).addEventListener("click",()=>track(n)));
gen();
</script>
</body>
</html>
